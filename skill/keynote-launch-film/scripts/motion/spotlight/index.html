<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="spotlight-render.js"></script>
<script>
const DUR=6.4, W=1920,H=1080;
const LOOK={lightColor:"#eaeeff",beamColor:"#babcf0",poolColor:"#e2c4ec",backgroundColor:"#010002",brightness:100,sourceX:0,sourceTop:0,floorY:0,rayCount:6,beamWidth:100,poolWidth:100,noPool:true};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), sm=t=>t*t*(3-2*t);
function refOf(t){ if(t<4.0) return t/4.0*6600; return 6600+(t-4.0)/1.4*1000; }
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
let fill,edge,last;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const BW=800,BH=466,BX=(W-BW)/2,BY=1080*0.9-BH; // bed placement
const lay=document.createElement('canvas');lay.width=W;lay.height=H;const lc=lay.getContext('2d');
function bedLayer(img,reveal){ // img masked by radial reveal growing from the beam impact point
  lc.globalCompositeOperation='source-over';lc.clearRect(0,0,W,H);
  lc.drawImage(img,BX,BY);
  const cx=W/2,cy=BY+BH*0.35,R=Math.max(1,reveal*760);
  const g=lc.createRadialGradient(cx,cy,R*0.55,cx,cy,R);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  lc.globalCompositeOperation='destination-in';lc.fillStyle=g;lc.fillRect(0,0,W,H);
  lc.globalCompositeOperation='source-over';return lay;
}
window.__render=function(t){
  const R=window.SpotlightRenderer;
  const dim=1-0.45*(1-Math.pow(1-sm(cl((t-4.05)/0.55)),2));LOOK.beamWidth=70+30*(dim-0.55)/0.45;R.renderFrame(ctx,W,H,refOf(t),LOOK,dim);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const rv=sm(cl((t-4.0)/1.3)), fl=sm(cl((t-5.2)/0.7));
  if(rv>0){
    // pool-like glow on the floor under the bed
    const gg=ctx.createRadialGradient(W/2,BY+BH-30,0,W/2,BY+BH-30,560*rv);
    gg.addColorStop(0,'rgba(226,210,240,'+(0.28*rv)+')');gg.addColorStop(1,'rgba(226,210,240,0)');
    ctx.save();ctx.translate(0,BY+BH-30);ctx.scale(1,0.28);ctx.translate(0,-(BY+BH-30));ctx.fillStyle=gg;ctx.fillRect(0,0,W,H*4);ctx.restore();
    const e=bedLayer(edge,rv*1.15);
    ctx.filter='blur(7px)';ctx.globalAlpha=0.9*rv;ctx.drawImage(e,0,0);
    ctx.filter='none';ctx.globalAlpha=0.95;ctx.drawImage(e,0,0);
    const f=bedLayer(fill,rv*1.15);ctx.globalAlpha=0.55*sm(cl((t-4.5)/1.0));ctx.drawImage(f,0,0);
  }
  ctx.restore();
  // flood to white, expanding from the bed
  if(fl>0){
    const cx=W/2,cy=BY+BH*0.5,Rr=fl*1500;
    ctx.save();ctx.globalCompositeOperation='source-over';
    const g=ctx.createRadialGradient(cx,cy,Rr*0.25,cx,cy,Rr);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,'+sm(cl((t-5.65)/0.35))+')';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  // final 0.4 s: dissolve white into act-2 frame 0
  const x=sm(cl((t-(DUR-0.4))/0.4));
  if(x>0){ctx.globalAlpha=x;ctx.drawImage(last,0,0,W,H);ctx.globalAlpha=1;}
};
Promise.all([load('bed_fill.png'),load('bed_edge.png'),load('act2_f0.png')]).then(a=>{[fill,edge,last]=a;window.__ready=true;});
</script></body></html>
